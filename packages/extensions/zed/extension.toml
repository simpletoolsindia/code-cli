id = "beast"
name = "BeastCLI"
description = "The open source coding agent."
version = "1.14.31"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/simpletoolsindia/code-cli"

[agent_servers.beastcli]
name = "BeastCLI"
icon = "./icons/beastcli.svg"

[agent_servers.beastcli.targets.darwin-aarch64]
archive = "https://github.com/simpletoolsindia/code-cli/releases/download/v1.14.31/beastcli-darwin-arm64.zip"
cmd = "./beastcli"
args = ["acp"]

[agent_servers.beastcli.targets.darwin-x86_64]
archive = "https://github.com/simpletoolsindia/code-cli/releases/download/v1.14.31/beastcli-darwin-x64.zip"
cmd = "./beastcli"
args = ["acp"]

[agent_servers.beastcli.targets.linux-aarch64]
archive = "https://github.com/simpletoolsindia/code-cli/releases/download/v1.14.31/beastcli-linux-arm64.tar.gz"
cmd = "./beastcli"
args = ["acp"]

[agent_servers.beastcli.targets.linux-x86_64]
archive = "https://github.com/simpletoolsindia/code-cli/releases/download/v1.14.31/beastcli-linux-x64.tar.gz"
cmd = "./beastcli"
args = ["acp"]

[agent_servers.beastcli.targets.windows-x86_64]
archive = "https://github.com/simpletoolsindia/code-cli/releases/download/v1.14.31/beastcli-windows-x64.zip"
cmd = "./beastcli.exe"
args = ["acp"]
