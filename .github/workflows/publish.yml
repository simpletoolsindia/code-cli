name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  push:
    branches:
      - ci
      - dev
      - beta
      - snapshot-*
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  version:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'simpletoolsindia/code-cli'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          beastcli-app-id: ${{ vars.BEAST_APP_ID }}
          beastcli-app-secret: ${{ secrets.BEAST_APP_SECRET }}

      - name: Install BeastCLI
        if: inputs.bump || inputs.version
        run: bun i -g beastcli-ai

      - id: version
        run: |
          ./script/version.ts
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          BEAST_BUMP: ${{ inputs.bump }}
          BEAST_VERSION: ${{ inputs.version }}
          BEAST_API_KEY: ${{ secrets.BEAST_API_KEY }}
          GH_REPO: ${{ (github.ref_name == 'beta' && 'simpletoolsindia/code-cli-beta') || github.repository }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build-cli:
    needs: version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'simpletoolsindia/code-cli'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          beastcli-app-id: ${{ vars.BEAST_APP_ID }}
          beastcli-app-secret: ${{ secrets.BEAST_APP_SECRET }}

      - name: Build
        id: build
        run: |
          ./packages/beastcli/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
        env:
          BEAST_VERSION: ${{ needs.version.outputs.version }}
          BEAST_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: beastcli-cli
          path: |
            packages/beastcli/dist/beastcli-darwin*
            packages/beastcli/dist/beastcli-linux*

      - uses: actions/upload-artifact@v4
        with:
          name: beastcli-cli-windows
          path: packages/beastcli/dist/beastcli-windows*
    outputs:
      version: ${{ needs.version.outputs.version }}

  sign-cli-windows:
    needs:
      - build-cli
      - version
    runs-on: blacksmith-4vcpu-windows-2025
    if: github.repository == 'simpletoolsindia/code-cli'
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: beastcli-cli-windows
          path: packages/beastcli/dist

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          beastcli-app-id: ${{ vars.BEAST_APP_ID }}
          beastcli-app-secret: ${{ secrets.BEAST_APP_SECRET }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\packages\beastcli\dist\beastcli-windows-arm64\bin\beastcli.exe
            ${{ github.workspace }}\packages\beastcli\dist\beastcli-windows-x64\bin\beastcli.exe
            ${{ github.workspace }}\packages\beastcli\dist\beastcli-windows-x64-baseline\bin\beastcli.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Windows CLI signatures
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\packages\beastcli\dist\beastcli-windows-arm64\bin\beastcli.exe",
            "${{ github.workspace }}\packages\beastcli\dist\beastcli-windows-x64\bin\beastcli.exe",
            "${{ github.workspace }}\packages\beastcli\dist\beastcli-windows-x64-baseline\bin\beastcli.exe"
          )

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - name: Repack Windows CLI archives
        working-directory: packages/beastcli/dist
        shell: pwsh
        run: |
          Compress-Archive -Path "beastcli-windows-arm64\bin\*" -DestinationPath "beastcli-windows-arm64.zip" -Force
          Compress-Archive -Path "beastcli-windows-x64\bin\*" -DestinationPath "beastcli-windows-x64.zip" -Force
          Compress-Archive -Path "beastcli-windows-x64-baseline\bin\*" -DestinationPath "beastcli-windows-x64-baseline.zip" -Force

      - name: Upload signed Windows CLI release assets
        if: needs.version.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" `
            "${{ github.workspace }}\packages\beastcli\dist\beastcli-windows-arm64.zip" `
            "${{ github.workspace }}\packages\beastcli\dist\beastcli-windows-x64.zip" `
            "${{ github.workspace }}\packages\beastcli\dist\beastcli-windows-x64-baseline.zip" `
            --clobber `
            --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@v4
        with:
          name: beastcli-cli-signed-windows
          path: |
            packages/beastcli/dist/beastcli-windows-arm64
            packages/beastcli/dist/beastcli-windows-x64
            packages/beastcli/dist/beastcli-windows-x64-baseline

  publish:
    needs:
      - version
      - build-cli
      - sign-cli-windows
    if: always() && !failure() && !cancelled()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-bun

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          beastcli-app-id: ${{ vars.BEAST_APP_ID }}
          beastcli-app-secret: ${{ secrets.BEAST_APP_SECRET }}

      - uses: actions/download-artifact@v4
        with:
          name: beastcli-cli
          path: packages/beastcli/dist

      - uses: actions/download-artifact@v4
        with:
          name: beastcli-cli-windows
          path: packages/beastcli/dist

      - uses: actions/download-artifact@v4
        with:
          name: beastcli-cli-signed-windows
          path: packages/beastcli/dist

      - uses: actions/download-artifact@v4
        if: needs.version.outputs.release
        with:
          pattern: latest-yml-*
          path: /tmp/latest-yml

      - name: Cache apt packages (AUR)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-aur-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-aur-

      - name: Setup SSH for AUR
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          git config --global user.email "beastcli@sst.dev"
          git config --global user.name "beast"
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts || true

      - run: ./script/publish.ts
        env:
          BEAST_VERSION: ${{ needs.version.outputs.version }}
          BEAST_RELEASE: ${{ needs.version.outputs.release }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          NPM_CONFIG_PROVENANCE: false
          LATEST_YML_DIR: /tmp/latest-yml
