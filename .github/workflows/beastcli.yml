name: beastcli

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  beastcli:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /beastcli') ||
      startsWith(github.event.comment.body, '/beastcli')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run beastcli
        uses: simpletoolsindia/code-cli/github@latest
        env:
          BEAST_API_KEY: ${{ secrets.BEAST_API_KEY }}
          BEAST_PERMISSION: '{"bash": "deny"}'
        with:
          model: beastcli/claude-opus-4-5
